<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#f97316" />
		<meta name="color-scheme" content="light dark" />
		<meta
			name="description"
			content="BNOS — Bitcoin Network Operations System. Open-source point of sale & commerce on Nostr."
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
		<script>
			// Apply persisted color mode + appearance prefs before first paint (no-flash).
			(function () {
				try {
					var stored = localStorage.getItem('bnos-os:prefs');
					var mode = 'system';
					var modeStored = localStorage.getItem('mode-watcher-mode');
					if (modeStored) {
						try {
							mode = JSON.parse(modeStored);
						} catch (_) {
							mode = modeStored;
						}
					}
					var prefersDark =
						window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
					var dark = mode === 'dark' || (mode !== 'light' && prefersDark);
					var root = document.documentElement;
					var locale = localStorage.getItem('bnos-os:locale');
					if (!locale) {
						try {
							locale = JSON.parse(localStorage.getItem('bnos-os:settings-general') || '{}').language;
						} catch (_) {}
					}
					if (locale === 'lo' || locale === 'th' || locale === 'en') root.dataset.locale = locale;
					if (dark) root.classList.add('dark');
					if (stored) {
						var p = JSON.parse(stored);
						if (p.surface) root.dataset.surface = p.surface;
						if (p.surfaceTint) root.dataset.surfaceTint = p.surfaceTint;
						if (p.neutral) root.dataset.neutral = p.neutral;
						if (p.density) root.dataset.density = p.density;
						if (p.radius) root.dataset.radius = p.radius;
					}
				} catch (e) {}
			})();
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
