name: Deploy BNOS console

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bnos-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
          cache: pnpm
      - name: Install and verify
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm run check
          pnpm test:unit --run
          pnpm build
      - name: Deploy checked commit
        env:
          BNOS_DEPLOY_SSH_KEY: ${{ secrets.BNOS_DEPLOY_SSH_KEY }}
        run: |
          test -n "$BNOS_DEPLOY_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$BNOS_DEPLOY_SSH_KEY" > ~/.ssh/bnos_deploy
          chmod 600 ~/.ssh/bnos_deploy
          printf '%s\n' '[46.224.89.32]:2222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJ9tbDbYWgbobzMlhRn/f1DHvtsd+JmFccAiO2dh4sVB' > ~/.ssh/known_hosts
          ssh -i ~/.ssh/bnos_deploy -o IdentitiesOnly=yes -p 2222 deploy@46.224.89.32 /usr/local/bin/bnos-deploy "$GITHUB_SHA"
